[tools]
rust = "latest"
typst = "latest"
typstyle = "latest"
# uv runs the training scripts; their dependencies are declared inline (PEP 723)
# so nothing is installed into a shared environment.
uv = "latest"

[tasks.install]
description = "Symlink thai-doc-engine into Typst's local package dir"
run = '''
#!/usr/bin/env bash
set -euo pipefail
BASE="${TYPST_PACKAGE_PATH:-${XDG_DATA_HOME:-$HOME/.local/share}/typst/packages}/local"
DEST="$BASE/thai-doc-engine"
# thai-doc-engine may itself be a stray symlink from a prior manual install
# (see CLAUDE.md gotcha) -- if so, `mkdir -p` would silently follow it into
# the wrong tree. Remove only if it's a symlink; keep it if it's a real dir
# with other content.
if [ -L "$DEST" ]; then
  rm "$DEST"
fi
mkdir -p "$DEST"
ln -sfn "$MISE_PROJECT_ROOT/package/thai-doc-engine/1.0.0" "$DEST/1.0.0"
echo "Installed @local/thai-doc-engine:1.0.0 -> $DEST/1.0.0"
'''

[tasks.format]
description = "Format all Typst files under docs/ in place"
run = "typstyle -i docs"

# Typst has no assertion framework, so "test" means: every fixture compiles
# cleanly to a non-empty PDF. The output name mirrors the fixture's path with
# the leading `tests/` dropped and `/` folded to `_`, which is the convention
# the committed PDFs in tests/out/ already use.
[tasks.typst_test]
description = "Compile every tests/**/*.typ into tests/out/ and report failures"
run = '''
#!/usr/bin/env bash
set -uo pipefail
cd "$MISE_PROJECT_ROOT"
mkdir -p tests/out
ok=0
fail=0
while IFS= read -r f; do
  # _fixtures.typ is an import-only module: it has no page content of its own.
  [ "$f" = "tests/_fixtures.typ" ] && continue
  out="tests/out/$(printf '%s' "${f#tests/}" | tr / _ | sed 's/\.typ$//').pdf"
  if typst compile --root . "$f" "$out" && [ -s "$out" ]; then
    ok=$((ok + 1))
    printf '  ok    %s -> %s\n' "$f" "$out"
  else
    fail=$((fail + 1))
    printf '  FAIL  %s\n' "$f"
  fi
done < <(find tests -name '*.typ' | sort)
printf '\n%d compiled, %d failed\n' "$ok" "$fail"
[ "$fail" -eq 0 ]
'''

# ===== wasm/thai-segmenter =====
# The plugin binary is committed so that compiling a Typst document never needs
# Rust. These tasks are for changing the plugin, not for using it.

[tasks.build_wasm]
description = "Build the BudouX plugin and install it into the Typst package"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
rustup target add wasm32-unknown-unknown
cargo build --release --manifest-path wasm/thai-segmenter/Cargo.toml \
  --target wasm32-unknown-unknown
cp wasm/thai-segmenter/target/wasm32-unknown-unknown/release/thai_segmenter.wasm \
  package/thai-doc-engine/1.0.0/thai_segmenter.wasm
ls -l package/thai-doc-engine/1.0.0/thai_segmenter.wasm
'''

[tasks.test_wasm]
description = "Test, lint and format-check the BudouX plugin on the host target"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
cargo test --release --manifest-path wasm/thai-segmenter/Cargo.toml --features cli
cargo clippy --manifest-path wasm/thai-segmenter/Cargo.toml --features cli --all-targets -- -D warnings
'''

# `eval` doubles as the benchmark: `mise run eval bench corpus.txt 3`.
# Modes are dump | score | stats | bench -- see wasm/thai-segmenter/src/bin/eval.rs.
[tasks.eval]
description = "Run the segmenter evaluation harness (dump|score|stats|bench)"
run = "cargo run --release --quiet --features cli --manifest-path wasm/thai-segmenter/Cargo.toml --bin eval --"

[tasks.corpus]
description = "Extract the Thai runs this repo's documents feed the plugin, for eval/bench"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
python3 - "$@" <<'PY'
import glob, re, sys
out = sys.argv[1] if len(sys.argv) > 1 else "wasm/thai-segmenter/training/corpus.txt"
# The same pattern engine.typ's show rule matches, so the corpus is exactly the
# input the plugin sees in production.
runs, seen = [], set()
for path in sorted(glob.glob("tests/**/*.typ", recursive=True)) + sorted(glob.glob("example/*.typ")):
    for run in re.findall(r"[฀-๿]{8,}", open(path, encoding="utf8").read()):
        if run not in seen:
            seen.add(run)
            runs.append(run)
open(out, "w", encoding="utf8").write("\n".join(runs) + "\n")
print(f"{len(runs)} runs, {sum(map(len, runs))} chars -> {out}")
PY
'''


# ===== training data =====
# Fetching and labelling corpora, not training. The training run itself stays
# manual -- see wasm/thai-segmenter/training/README.md.

[tasks.download_train_dataset]
description = "Fetch LST20 + VISTEC + Thai Wikipedia into wasm/thai-segmenter/training/data/raw"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
uv run wasm/thai-segmenter/training/download.py "$@"
'''

[tasks.prepare_train_dataset]
description = "Label the fetched corpora into BudouX U+2581 training files"
depends = ["download_train_dataset"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
uv run wasm/thai-segmenter/training/prepare.py "$@"
'''
